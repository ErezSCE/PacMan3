version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-localhost}/pacman3:${DOCKER_TAG:-latest}
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
